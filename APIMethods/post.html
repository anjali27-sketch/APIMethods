<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Post Method</h2>
    <button onclick="addData()">
        Add Data
    </button>
    <p id="result"></p>
    <script>
        function addData() {
            fetch("https://jsonplaceholder.typicode.com/posts", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name:"Anjali Patil",
                    email:"anjupatil@gmail.com"
                })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('result').innerText = "Data added successfully!"+"<br>" +
                "Name: "+ data.name ;
            });
        }
    </script>
</body>
</html>
